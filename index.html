        const { useState, useEffect, useMemo, useRef, createElement: e } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycby6aeRjm05ipztLmOZLydBuLFqdtDiVm2OqmKcKDvEhHorXlWGQdX5Ut9daJlj2XrFc/exec";

        // Helper para formatear fecha a DIA/MES/AÑO HORA:MINUTO:SEGUNDOS
        const formatearFecha = (str) => {
            if (!str || str === "-") return "-";
            const s = String(str).trim();
            // Si viene en formato yyyy-mm-dd hh:mm:ss o yyyy/mm/dd hh:mm:ss
            const matchIso = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(.*)$/);
            if (matchIso) {
                const dia = matchIso[3].padStart(2, '0');
                const mes = matchIso[2].padStart(2, '0');
                const anio = matchIso[1];
                const resto = matchIso[4] ? matchIso[4].trim() : '';
                return `${dia}/${mes}/${anio}${resto ? ' ' + resto : ''}`;
            }
            return s;
        };

        // Helpers para URLs de Google Drive
        const getDriveFileId = (url) => {
            if (!url || typeof url !== 'string') return null;
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        };

        const getDrivePreviewUrl = (url) => {
            const fileId = getDriveFileId(url);
            if (fileId) {
                return "https://drive.google.com/file/d/" + fileId + "/preview";
            }
            return (url && url.startsWith('http')) ? url : null;
        };

        const getDriveThumbnailUrl = (url) => {
            const fileId = getDriveFileId(url);
            if (fileId) {
                return "https://drive.google.com/thumbnail?id=" + fileId + "&sz=w360";
            }
            return null;
        };

            className, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round"

            e('line', { x1: "6", y1: "6", x2: "18", y2: "18" })

        const App = () => {
            const [pestana, setPestana] = useState('FOLIO');
            const [loading, setLoading] = useState(false);
            const [loadingUsuarios, setLoadingUsuarios] = useState(true);
            const [usuarios, setUsuarios] = useState([]);
            const [tipo, setTipo] = useState('OFICIO');
            const [modal, setModal] = useState({ show: false, folio: '', tipo: '', solicitante: '' });
            const [alerta, setAlerta] = useState(null);

            const [errorTabla, setErrorTabla] = useState(null);
            const [tablaDatos, setTablaDatos] = useState([]);
            const [tablaHeaders, setTablaHeaders] = useState([]);
            const [loadingTabla, setLoadingTabla] = useState(false);
            const [descargandoExcel, setDescargandoExcel] = useState(false);
            const [busqueda, setBusqueda] = useState('');
            const [filtroEstatus, setFiltroEstatus] = useState('TODOS');
            const [pagina, setPagina] = useState(0);
            const [filasPorPagina, setFilasPorPagina] = useState(10);
            const [subiendoFilaId, setSubiendoFilaId] = useState(null);

            const [pwdModal, setPwdModal] = useState({ show: false, action: null, title: '' });
            const [pwdInput, setPwdInput] = useState('');
            const [showPwd, setShowPwd] = useState(false);

            // Estado para el visor modal de acuses
            const [previewModal, setPreviewModal] = useState({
                show: false,
                url: '',
                folio: '',
                solicitante: '',
                tipo: '',
                fecha: ''
            });

            // Estado para hover tooltip
            const [hoverPreview, setHoverPreview] = useState({
                show: false,
                url: '',
                folio: '',
                x: 0,
                y: 0
            });

            const fileInputRef = useRef(null);
            const [filaSeleccionadaParaCarga, setFilaSeleccionadaParaCarga] = useState(null);

            const initialFormData = {
                "DIRIGIDO A": "",
                "CARGO/DEPENDENCIA/DIRECCION/NSS": "",
                "ASUNTO": "",
                "QUIEN SOLICITA": "",
                "DE QUE ÁREA": ""
            };

            const [formData, setFormData] = useState(initialFormData);

            // Cargar usuarios alfabéticamente
            const cargarUsuarios = async () => {
                setLoadingUsuarios(true);
                try {
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler((res) => {
                                if (res && res.status === 'ok' && Array.isArray(res.usuarios)) {
                                    setUsuarios(res.usuarios);
                                }
                                setLoadingUsuarios(false);
                            })
                            .withFailureHandler(() => setLoadingUsuarios(false))
                            .obtenerUsuariosIniciales();
                    } else {
                        const response = await fetch(API_URL + "?action=cargaInicial");
                        const data = await response.json();
                        if (data && data.status === 'ok' && Array.isArray(data.usuarios)) {
                            setUsuarios(data.usuarios);
                        }
                        setLoadingUsuarios(false);
                    }
                } catch (error) {
                    console.error("Error al conectar usuarios:", error);
                    setLoadingUsuarios(false);
                }
            };

            // Cargar datos de la tabla CONSECUTIVOS
            const cargarTabla = async () => {
                setLoadingTabla(true);
                setErrorTabla(null);
                try {
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler((res) => {
                                if (res && res.status === 'ok') {
                                    setTablaDatos(res.data || []);
                                    setTablaHeaders(res.headers || []);
                                } else {
                                    setErrorTabla(res && res.message ? res.message : "Error al obtener tabla");
                                }
                                setLoadingTabla(false);
                            })
                            .withFailureHandler((err) => {
                                setErrorTabla("Error en Apps Script: " + (err.message || err));
                                setLoadingTabla(false);
                            })
                            .obtenerTablaConsecutivos();
                    } else {
                        let res = null;
                        let errorDetalle = null;
                        try {
                            const response = await fetch(API_URL + "?action=obtenerTabla");
                            res = await response.json();
                        } catch (errGet) {
                            console.warn("GET falló, intentando POST:", errGet);
                            try {
                                const responsePost = await fetch(API_URL, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                    body: JSON.stringify({ action: 'obtenerTabla' })
                                });
                                res = await responsePost.json();
                            } catch (errPost) {
                                errorDetalle = "No se pudo conectar con el Web App: " + errPost.message;
                            }
                        }

                        if (res && res.status === 'ok') {
                            setTablaDatos(res.data || []);
                            setTablaHeaders(res.headers || []);
                        } else if (res && res.status === 'error') {
                            setErrorTabla("Error del servidor: " + res.message);
                        } else if (errorDetalle) {
                            setErrorTabla(errorDetalle);
                        }
                        setLoadingTabla(false);
                    }
                } catch (error) {
                    setErrorTabla("Error general: " + error.message);
                    setLoadingTabla(false);
                }
            };

            // Descarga de archivo Blob en navegador
            const descargarArchivoBlob = (base64, fileName, mimeType) => {
                const byteCharacters = atob(base64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: mimeType || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.download = fileName || 'Concentrado_Folios.xlsx';
                link.click();
            };

            // Manejo de Descarga de Concentrado Excel
            const handleDescargarExcel = () => {
                setPwdInput('');
                setShowPwd(false);
                setPwdModal({ show: true, action: 'EXCEL', title: 'Contraseña para descargar Excel' });
            };

            // validarAccesoViaAPI: helper para validar por fetch cuando google.script.run no está disponible
            const validarAccesoViaAPI = async (pwd, onValid, onInvalid) => {
                try {
                    console.log('[ACCESO] Validando via fetch GET API_URL, pwd:', pwd);
                    const url = API_URL + "?action=validarAcceso&password=" + encodeURIComponent(pwd);
                    const res = await fetch(url);
                    const data = await res.json();
                    console.log('[ACCESO] Respuesta API:', data);
                    if (data && data.valid === true) onValid();
                    else onInvalid();
                } catch (err) {
                    console.error('[ACCESO] Error fetch validarAcceso:', err);
                    onInvalid();
                }
            };

            const handlePwdSubmit = (ev) => {
                ev.preventDefault();
                const action = pwdModal.action;
                // Agregar sufijo M si no lo tiene ya (matrículas son texto con M al final)
                const pwdRaw = pwdInput.trim();
                const pwd = pwdRaw.toUpperCase().endsWith('M') ? pwdRaw : pwdRaw + 'M';
                setPwdModal({ show: false, action: null, title: '' });
                setPwdInput('');

                // === DIAGNÓSTICO ===
                const tieneGAS = typeof google !== 'undefined' && google.script && google.script.run;
                console.log('[ACCESO] action:', action);
                console.log('[ACCESO] pwdRaw enviado:', pwdRaw);
                console.log('[ACCESO] pwd con M:', pwd);
                console.log('[ACCESO] google.script.run disponible:', tieneGAS);

                if (action === 'ACUSES') {
                    if (tieneGAS) {
                        google.script.run
                            .withSuccessHandler((isValid) => {
                                console.log('[ACCESO] validarAcceso respuesta:', isValid);
                                if (isValid) setPestana('ACUSES');
                                else alert("Contraseña incorrecta o sin acceso ADMIN.");
                            })
                            .withFailureHandler((err) => {
                                console.error('[ACCESO] Error en validarAcceso:', err);
                                alert("Error al validar: " + (err.message || JSON.stringify(err)));
                            })
                            .validarAcceso(pwd);
                    } else {
                        validarAccesoViaAPI(pwd,
                            () => setPestana('ACUSES'),
                            () => alert("Contraseña incorrecta o sin acceso ADMIN.")
                        );
                    }
                } else if (action === 'EXCEL') {
                    setDescargandoExcel(true);
                    const processDownload = async () => {
                        if (tieneGAS) {
                            google.script.run
                                .withSuccessHandler((res) => {
                                    console.log('[ACCESO] descargarConcentradoExcel respuesta:', res);
                                    setDescargandoExcel(false);
                                    if (res && res.base64) {
                                        descargarArchivoBlob(res.base64, res.fileName, res.mimeType);
                                    } else if (res && res.directUrl) {
                                        window.open(res.directUrl, '_blank');
                                    }
                                })
                                .withFailureHandler((err) => {
                                    setDescargandoExcel(false);
                                    console.error('[ACCESO] Error descargar Excel:', err);
                                    alert("Error al descargar Excel: " + err.message);
                                })
                                .descargarConcentradoExcel();
                        } else {
                            // Modo fetch: pedir URL de descarga al API y abrir en nueva pestaña
                            try {
                                console.log('[ACCESO] Descargando Excel via GET API_URL');
                                const res = await fetch(API_URL + "?action=descargarExcel");
                                const data = await res.json();
                                console.log('[ACCESO] Respuesta descarga Excel:', data);
                                setDescargandoExcel(false);
                                if (data && data.directUrl) {
                                    window.open(data.directUrl, '_blank');
                                } else if (data && data.base64) {
                                    descargarArchivoBlob(data.base64, data.fileName, data.mimeType);
                                } else {
                                    // Fallback directo a la hoja CONSECUTIVOS
                                    window.open("https://docs.google.com/spreadsheets/d/1JprSafQVswT7aZHo3GXxC6v65F38pR_LOaBEOC9SDTU/export?format=xlsx&gid=0", '_blank');
                                }
                            } catch (err) {
                                console.error('[ACCESO] Error descarga Excel fetch:', err);
                                setDescargandoExcel(false);
                                // Fallback directo
                                window.open("https://docs.google.com/spreadsheets/d/1JprSafQVswT7aZHo3GXxC6v65F38pR_LOaBEOC9SDTU/export?format=xlsx&gid=0", '_blank');
                            }
                        }
                    };


                    if (tieneGAS) {
                        google.script.run
                            .withSuccessHandler((isValid) => {
                                console.log('[ACCESO] validarAcceso (Excel) respuesta:', isValid);
                                if (isValid) {
                                    processDownload();
                                } else {
                                    setDescargandoExcel(false);
                                    alert("Contraseña incorrecta o sin acceso ADMIN.");
                                }
                            })
                            .withFailureHandler((err) => {
                                setDescargandoExcel(false);
                                console.error('[ACCESO] Error en validarAcceso (Excel):', err);
                                alert("Error al validar: " + (err.message || JSON.stringify(err)));
                            })
                            .validarAcceso(pwd);
                    } else {
                        validarAccesoViaAPI(pwd,
                            () => processDownload(),
                            () => { setDescargandoExcel(false); alert("Contraseña incorrecta o sin acceso ADMIN."); }
                        );
                    }
                }
            };

            useEffect(() => {
                cargarUsuarios();
                cargarTabla();
            }, []);

            useEffect(() => {
                if (pestana === 'ACUSES') {
                    cargarTabla();
                }
            }, [pestana]);

            const handleInputChange = (eTarget) => {
                const { name, value } = eTarget.target;
                setFormData(prev => ({ ...prev, [name]: value.toUpperCase() }));
            };

            const handleSubmit = async (ev) => {
                ev.preventDefault();
                setLoading(true);
                setAlerta(null);

                const solicitanteCapturado = formData["QUIEN SOLICITA"];
                const tipoActual = tipo;

                const payload = {
                    ...formData,
                    "TIPO": tipoActual,
                    "ESTATUS": "ACUSE PENDIENTE"
                };

                try {
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler((res) => {
                                setLoading(false);
                                if (res && res.status === 'ok') {
                                    setModal({
                                        show: true,
                                        folio: res.folio || 'FOLIO ASIGNADO',
                                        tipo: tipoActual,
                                        solicitante: solicitanteCapturado
                                    });
                                    setFormData(initialFormData);
                                    cargarTabla();
                                } else {
                                    setAlerta(res && res.message ? res.message : "Error al generar el folio");
                                }
                            })
                            .withFailureHandler((err) => {
                                setLoading(false);
                                setAlerta(err.message || "Error al conectar con Google Sheets");
                            })
                            .registrarFolio(payload);
                        return;
                    }

                    let result = null;
                    try {
                        const responsePost = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload)
                        });
                        result = await responsePost.json();
                    } catch (postError) {
                        const responseGet = await fetch(API_URL + "?action=registrarFolio&payload=" + encodeURIComponent(JSON.stringify(payload)));
                        result = await responseGet.json();

                                            e('td', { className: "py-2.5 px-3 text-center whitespace-nowrap text-xs font-normal" },
                                                esCargando ? e('span', { className: "inline-flex items-center gap-1.5 text-xs text-[#3f8569] font-normal animate-pulse" },
                                                    e('div', { className: "w-3 h-3 border-2 border-[#3f8569] border-t-transparent rounded-full animate-spin" }), "Subiendo..."
                                                ) : tieneAcuse ? e('div', { className: "inline-flex items-center gap-1.5" },
                                                    e('button', {
                                                        type: 'button',
                                                        onClick: () => abrirPreviewModal(row),
                                                        onMouseEnter: (ev) => handleMouseEnterAcuse(ev, row),
                                                        onMouseLeave: handleMouseLeaveAcuse,
                                                        className: "inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 active:scale-95 rounded-lg text-xs font-normal border border-emerald-200 transition-all cursor-pointer shadow-sm"
                                                    }, e(IconEye, { className: "w-3.5 h-3.5 text-emerald-600" }), "Ver Acuse"),
                                                    e('button', {
                                                        type: 'button',
                                                        onClick: () => abrirSelectorArchivo(row),
                                                        title: "Actualizar archivo",
                                                        className: "p-1 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded transition-colors"
                                                    }, e(IconUpload, { className: "w-3.5 h-3.5" }))
                                                ) : e('button', {
                                                    type: 'button',
                                                    onClick: () => abrirSelectorArchivo(row),
                                                    className: "inline-flex items-center gap-1 px-2.5 py-1 bg-orange-50 text-orange-700 hover:bg-orange-100 active:scale-95 rounded-lg text-xs font-normal border border-orange-200 transition-all shadow-sm"
                                                }, e(IconUpload, { className: "w-3.5 h-3.5" }), "Subir Acuse")
                                            ),

                                            // 3. ESTATUS (TEXTO NORMAL)
                                            e('td', { className: "py-2.5 px-3 whitespace-nowrap text-xs font-normal" },
                                                e('span', { className: "inline-block px-2 py-0.5 rounded text-xs font-normal tracking-tight " + (esRecibido ? 'bg-emerald-100 text-emerald-800' : 'bg-orange-100 text-orange-800') },
                                                    row.ESTATUS || row.estatus || 'ACUSE PENDIENTE'
                                                )
                                            ),

                                            // 4. FECHA DIA/MES/AÑO HORA:MINUTO:SEGUNDOS (TEXTO NORMAL)
                                            e('td', { className: "py-2.5 px-3 text-gray-600 whitespace-nowrap text-xs font-normal font-mono" }, fechaFormateada),

                                            // 5. TIPO (TEXTO NORMAL)
                                            e('td', { className: "py-2.5 px-3 whitespace-nowrap text-gray-700 text-xs font-normal" }, row.TIPO || row.tipo || "-"),

                                            // 6. QUIEN SOLICITA (TEXTO NORMAL)
                                            e('td', { className: "py-2.5 px-3 text-gray-700 max-w-[180px] truncate text-xs font-normal", title: row["QUIEN SOLICITA"] || row.SOLICITANTE }, row["QUIEN SOLICITA"] || row.SOLICITANTE || "-"),

                                            // 7. DIRIGIDO A (TEXTO NORMAL)
                                            e('td', { className: "py-2.5 px-3 text-gray-700 max-w-[160px] truncate text-xs font-normal", title: row["DIRIGIDO A"] || row.DESTINATARIO }, row["DIRIGIDO A"] || row.DESTINATARIO || "-"),

                                            // 8. ASUNTO (TEXTO NORMAL)
                                            e('td', { className: "py-2.5 px-3 text-gray-600 max-w-[200px] truncate text-xs font-normal", title: row.ASUNTO || row.asunto }, row.ASUNTO || row.asunto || "-"),

                                            // 9. DE QUE ÁREA (TEXTO NORMAL)
                                            e('td', { className: "py-2.5 px-3 text-gray-600 max-w-[140px] truncate text-xs font-normal", title: row["DE QUE ÁREA"] || row.AREA }, row["DE QUE ÁREA"] || row.AREA || "-"),

                                            // 10. CARGO/DEPENDENCIA/DIRECCION/NSS (TEXTO NORMAL)
                                            e('td', { className: "py-2.5 px-3 text-gray-500 max-w-[150px] truncate text-xs font-normal", title: row["CARGO/DEPENDENCIA/DIRECCION/NSS"] || row.CARGO }, row["CARGO/DEPENDENCIA/DIRECCION/NSS"] || row.CARGO || "-")
                                        );
                                    })
                                )
                            )
                        ),
                        // Paginación
                        e('div', { className: "px-4 py-2 bg-gray-50 border-t border-gray-200 flex flex-wrap items-center justify-between gap-2 text-xs text-gray-600 font-normal" },
                            e('div', { className: "flex items-center gap-2" },
                                e('span', null, "Filas por página:"),
                                e('select', {
                                    value: filasPorPagina,
                                    onChange: (ev) => { setFilasPorPagina(Number(ev.target.value)); setPagina(0); },
                                    className: "bg-white border border-gray-300 rounded px-2 py-1 text-xs font-normal outline-none"
                                },
                                    e('option', { value: 10 }, "10"),
                                    e('option', { value: 25 }, "25"),
                                    e('option', { value: 50 }, "50"),
                                    e('option', { value: 100 }, "100")
                                )
                            ),
                            e('div', { className: "flex items-center gap-3" },
                                e('span', null, datosFiltrados.length === 0 ? "0 de 0" : `${pagina * filasPorPagina + 1}–${Math.min((pagina + 1) * filasPorPagina, datosFiltrados.length)} de ${datosFiltrados.length}`),
                                e('div', { className: "flex gap-1" },
                                    e('button', {
                                        type: 'button',
                                        disabled: pagina === 0,
                                        onClick: () => setPagina(p => Math.max(0, p - 1)),
                                        className: "px-2.5 py-1 rounded " + (pagina === 0 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-700 hover:bg-gray-200')
                                    }, "<"),
                                    e('button', {
                                        type: 'button',
                                        disabled: pagina >= totalPaginas - 1,
                                        onClick: () => setPagina(p => Math.min(totalPaginas - 1, p + 1)),
                                        className: "px-2.5 py-1 rounded " + (pagina >= totalPaginas - 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-700 hover:bg-gray-200')
                                    }, ">")
                                )
                            )
                        )
                    )
                ) : null,

                // Modal Visor Acuse
                previewModal.show ? e('div', { className: "fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-3 sm:p-5 z-50 animate-fadeIn" },
                    e('div', { className: "bg-white rounded-3xl p-4 sm:p-6 max-w-3xl w-full flex flex-col shadow-2xl border border-white animate-modal max-h-[90vh]" },
                        e('div', { className: "flex items-center justify-between pb-3 mb-3 border-b border-gray-100" },
                            e('div', { className: "flex items-center gap-2.5" },
                                e('div', { className: "p-2 imss-green text-white rounded-xl shadow-sm" }, e(IconFileText, { className: "w-5 h-5" })),
                                e('div', null,
                                    e('div', { className: "flex items-center gap-2" },
                                        e('h3', { className: "text-sm font-black text-gray-900 uppercase tracking-tight" }, `Acuse: ${previewModal.folio}`),
                                        e('span', { className: "px-2 py-0.5 rounded text-[10px] font-bold bg-[#3f8569]/10 text-[#003d25] uppercase" }, previewModal.tipo)
                                    ),
                                    e('p', { className: "text-[11px] text-gray-500 font-normal" }, `Solicitante: ${previewModal.solicitante} | Fecha: ${previewModal.fecha}`)
                                )
                            ),
                            e('div', { className: "flex items-center gap-1.5" },
                                previewModal.url ? e('a', {
                                    href: previewModal.url,
                                    target: "_blank",
                                    rel: "noopener noreferrer",
                                    className: "flex items-center gap-1 px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold transition-all shadow-sm"
                                }, e(IconExternalLink, { className: "w-3.5 h-3.5" }), "Google Drive") : null,
                                e('button', {
                                    type: 'button',
                                    onClick: () => setPreviewModal({ show: false, url: '', folio: '', solicitante: '', tipo: '', fecha: '' }),
                                    className: "p-1.5 text-gray-400 hover:text-gray-800 hover:bg-gray-100 rounded-xl transition-all"
                                }, e(IconClose, { className: "w-5 h-5" }))
                            )
                        ),
                        e('div', { className: "w-full flex-1 min-h-[420px] max-h-[60vh] bg-gray-50 rounded-2xl overflow-hidden border border-gray-200 relative flex items-center justify-center" },
                            getDrivePreviewUrl(previewModal.url) ? e('iframe', {
                                src: getDrivePreviewUrl(previewModal.url),
                                title: `Visor ${previewModal.folio}`,
                                className: "w-full h-full min-h-[420px] rounded-2xl border-0",
                                allow: "autoplay"
                            }) : e('div', { className: "text-center p-6 text-gray-400" },
                                e(IconFileText, { className: "w-10 h-10 mx-auto mb-2 text-gray-300" }),
                                e('p', { className: "text-xs font-semibold" }, "No se pudo cargar la vista previa del documento.")
                            )
                        ),
                        e('div', { className: "flex justify-end pt-3 mt-3 border-t border-gray-100" },
                            e('button', {
                                type: 'button',
                                onClick: () => setPreviewModal({ show: false, url: '', folio: '', solicitante: '', tipo: '', fecha: '' }),
                                className: "px-5 py-2 bg-gray-900 hover:bg-black text-white rounded-xl text-xs font-bold uppercase tracking-wider transition-all shadow"
                            }, "Cerrar Visor")
                        )
                    )
                ) : null,

                // Modal de Éxito
                modal.show ? e('div', { className: "fixed inset-0 bg-[#003d25]/60 backdrop-blur-sm flex items-center justify-center p-3 z-50" },
                    e('div', { className: "bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border border-white animate-modal" },
                        e('div', { className: "w-16 h-16 imss-green rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg shadow-[#3f8569]/30" },
                            e(IconCheckCircle, { className: "text-white w-8 h-8" })
                        ),
                        e('span', { className: "inline-block px-3 py-1 rounded-full text-[10px] font-black tracking-wider uppercase mb-2 bg-[#3f8569]/10 text-[#003d25]" },
                            `DOCUMENTO ASIGNADO: ${modal.tipo}`
                        ),
                        e('h3', { className: "text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-1" }, "Número de Folio"),
                        e('p', { className: "text-3xl font-black imss-text mb-4 tracking-tighter leading-none" }, modal.folio),
                        modal.solicitante ? e('div', { className: "mb-4 p-2.5 bg-gray-50 rounded-xl text-left border border-gray-100" },
                            e('span', { className: "block text-[9px] font-bold text-gray-400 uppercase" }, "Solicitante:"),
                            e('span', { className: "text-xs font-bold text-gray-700 truncate block" }, modal.solicitante)
                        ) : null,
                        e('button', {
                            type: 'button',
                            onClick: () => setModal({ show: false, folio: '', tipo: '', solicitante: '' }),
                            className: "w-full py-3 bg-gray-900 text-white rounded-xl font-bold hover:bg-black transition-all shadow-md text-xs tracking-wider uppercase"
                        }, "ACEPTAR")
                    )
                ) : null,

                // Modal de Contraseña
                pwdModal.show ? e('div', { className: "fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 z-50 animate-fadeIn" },
                    e('div', { className: "bg-white rounded-2xl p-5 max-w-sm w-full shadow-2xl border border-gray-100 animate-modal relative" },
                        e('button', {
                            type: 'button',
                            onClick: () => setPwdModal({ show: false, action: null, title: '' }),
                            className: "absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
                        }, e(IconClose, { className: "w-5 h-5" })),
                        e('div', { className: "flex items-center gap-3 mb-4" },
                            e('div', { className: "p-2 bg-emerald-100 text-emerald-800 rounded-xl" },
                                e(IconEyeOff, { className: "w-5 h-5" })
                            ),
                            e('h3', { className: "text-sm font-black text-gray-800" }, "Validación Requerida")
                        ),
                        e('p', { className: "text-xs text-gray-600 mb-4 font-medium" }, pwdModal.title),
                        e('form', { onSubmit: handlePwdSubmit },
                            e('div', { className: "relative mb-4" },
                                e('input', {
                                    type: showPwd ? "text" : "password",
                                    autoFocus: true,
                                    required: true,
                                    value: pwdInput,
                                    onChange: (e) => setPwdInput(e.target.value),
                                    placeholder: "Ingrese su matrícula..",
                                    className: "w-full pl-3 pr-10 py-2.5 bg-gray-50 border border-gray-200 focus:border-[#3f8569] focus:bg-white rounded-xl outline-none transition-all text-sm text-gray-800 font-semibold"
                                }),
                                e('button', {
                                    type: 'button',
                                    onClick: () => setShowPwd(!showPwd),
                                    className: "absolute right-2.5 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-gray-600 transition-colors rounded-lg"
                                }, showPwd ? e(IconEyeOff, { className: "w-4 h-4" }) : e(IconEye, { className: "w-4 h-4" }))
                            ),
                            e('div', { className: "flex gap-2" },
                                e('button', {
                                    type: 'button',
                                    onClick: () => setPwdModal({ show: false, action: null, title: '' }),
                                    className: "flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold transition-all text-xs"
                                }, "Cancelar"),
                                e('button', {
                                    type: 'submit',
                                    className: "flex-1 py-2.5 imss-green hover:bg-[#004d33] text-white rounded-xl font-bold transition-all shadow-md text-xs"
                                }, "Aceptar")
                            )
                        )
                    )
                ) : null,

                // Footer
                e('footer', { className: "text-gray-400 text-[9px] font-bold tracking-widest uppercase text-center py-1 mt-1" },
                    "Control de Gestión y Acuses | 2026"
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>

</html>
