<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Correspondencia</title>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <!-- Tailwind CSS v2.2.19 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F0F4F8;
      background-image: radial-gradient(at 0% 0%, rgba(59, 122, 158, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 0%, rgba(235, 114, 100, 0.04) 0px, transparent 50%);
    }

    /* Estilos Glassmorphism */
    .glass-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(229, 231, 235, 0.8);
    }

    /* Color Base Azul Coral */
    .inst-green {
      background-color: #8DE0B6;
    }

    .inst-green-hover:hover {
      background-color: #66C895;
    }

    .inst-text {
      color: #13384D;
    }

    .inst-border-focus:focus {
      border-color: #8DE0B6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 122, 158, 0.2);
    }

    /* Scrollbar personalizada */
    .table-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .table-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .table-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .table-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Entrada de texto forzada a Mayúsculas */
    .input-upper {
      text-transform: uppercase;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.95);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-modal {
      animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body class="min-h-screen text-gray-800 antialiased w-full">
  <div id="root" class="w-full min-h-screen"></div>

  <!-- React 18 Core Production -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <!-- ReactDOM 18 Production -->
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useRef } = React;

    // SAFE STORAGE WRAPPER — FALLBACK EN MEMORIA PARA PROTOCOLO file:
    const _memStore = new Map();
    const safeStorage = {
      getItem(k) { try { return sessionStorage.getItem(k); } catch(e) { return _memStore.get(k) || null; } },
      setItem(k,v) { try { sessionStorage.setItem(k,v); } catch(e) {} _memStore.set(k,v); },
      removeItem(k) { try { sessionStorage.removeItem(k); } catch(e) {} _memStore.delete(k); }
    };

    // CONFIGURACIÓN DINÁMICA DE API (VÍA QUERY PARAM ?api=...)
    const urlParams = new URLSearchParams(window.location.search);
    const paramApi = urlParams.get('api');
    if (paramApi) { safeStorage.setItem('sys_api_url', paramApi); }
    const API_URL = paramApi || safeStorage.getItem('sys_api_url') || "";

    // Iconos SVG Integrados en código
    const IconPlusCircle = () => e('svg', { className: 'w-4 h-4 mr-1.5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z' }));
    const IconTable = () => e('svg', { className: 'w-4 h-4 mr-1.5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' }));
    const IconUpload = () => e('svg', { className: 'w-7 h-7 mb-2 text-gray-400', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12' }));
    const IconTrash = () => e('svg', { className: 'w-4 h-4 text-red-500', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16' }));
    const IconEye = () => e('svg', { className: 'w-3.5 h-3.5 mr-1', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M15 12a3 3 0 11-6 0 3 3 0 016 0z' }), e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z' }));
    const IconX = () => e('svg', { className: 'w-4 h-4', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M6 18L18 6M6 6l12 12' }));
    const IconCheck = () => e('svg', { className: 'w-4 h-4 mr-1.5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2.5' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M5 13l4 4L19 7' }));
    const IconExternalLink = () => e('svg', { className: 'w-3.5 h-3.5 ml-1', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14' }));
    const IconMail = () => e('svg', { className: 'w-3.5 h-3.5 ml-1', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z' }));
    const IconLock = () => e('svg', { className: 'w-8 h-8 text-[#8DE0B6]', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' }));
    const IconRefresh = () => e('svg', { className: 'w-3.5 h-3.5 mr-1', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15' }));

    function App() {
      // Estado de Verificación y Sesión
      const [token, setToken] = useState(() => safeStorage.getItem('sys_admin_token') || '');
      const [sesionTime, setSesionTime] = useState(() => safeStorage.getItem('sesion_time') || '');
      const [modalAccesoOpen, setModalAccesoOpen] = useState(!safeStorage.getItem('sys_admin_token'));
      const [matriculaInput, setMatriculaInput] = useState('');
      const [mensajeErrorAcceso, setMensajeErrorAcceso] = useState('');
      const [validandoAcceso, setValidandoAcceso] = useState(false);

      // Pestañas
      const [pestaña, setPestaña] = useState('captura');

      // Estado Herramientas: Roles y Permisos
      const [rolesData, setRolesData] = useState([]);
      const [permisosData, setPermisosData] = useState([]);
      const [rolSeleccionado, setRolSeleccionado] = useState('');
      const [cargandoHerr, setCargandoHerr] = useState(false);
      const [mensajeHerr, setMensajeHerr] = useState('');
      const [tabHerr, setTabHerr] = useState('roles'); // 'roles' | 'permisos' | 'asignar'
      const [usuariosGestion, setUsuariosGestion] = useState([]);
      const [rolAsignarMap, setRolAsignarMap] = useState({});

      // Estado Formulario de Captura
      const [noDocto, setNoDocto] = useState('');
      const [asunto, setAsunto] = useState('');
      const [deDonde, setDeDonde] = useState('area_interna');
      const [subDeDondeVal, setSubDeDondeVal] = useState('');
      const [fechaRecepcion, setFechaRecepcion] = useState('');
      const [fechaTermino, setFechaTermino] = useState('');
      const [sinFecha, setSinFecha] = useState(false);
      const [dirigidoAreas, setDirigidoAreas] = useState([]);
      const [archivoPdf, setArchivoPdf] = useState(null);
      const [archivoPdfNombre, setArchivoPdfNombre] = useState('');
      const [guardando, setGuardando] = useState(false);

      // Catálogos e Histórico
      const [areasCatalogo, setAreasCatalogo] = useState([]);
      const [registros, setRegistros] = useState([]);
      const [cargando, setCargando] = useState(false);
      const [filtroBusqueda, setFiltroBusqueda] = useState('');
      const [filtroEstatus, setFiltroEstatus] = useState('TODOS');
      const [showDropdownAreas, setShowDropdownAreas] = useState(false);

      // Referencias para Hover y Visor de Archivos
      const [hoveredPdfUrl, setHoveredPdfUrl] = useState(null);
      const [hoveredPdfPos, setHoveredPdfPos] = useState({ top: 0, left: 0 });
      const [previewModalUrl, setPreviewModalUrl] = useState(null);
      const fileInputRef = useRef(null);

      // Estado Correo
      const [modalCorreoOpen, setModalCorreoOpen] = useState(false);
      const [correoReg, setCorreoReg] = useState(null);
      const [correoForm, setCorreoForm] = useState({ asunto: 'CONOCIMIENTO', destinatario: '' });
      const [generandoCorreo, setGenerandoCorreo] = useState(false);

      // REVISIÓN PERIÓDICA DE EXPIRACIÓN DEL TOKEN (CADA 30 SEGUNDOS - MÁXIMO 1,800,000 MS / 30 MIN)
      useEffect(() => {
        if (!token) return;
        const intervalo = setInterval(() => {
          const lt = safeStorage.getItem('sesion_time');
          if (lt) {
            const diff = Date.now() - parseInt(lt, 10);
            if (diff >= 1800000) { // 30 minutos cumplidos
              alert("Su sesión ha expirado por límite de tiempo de 30 minutos. Ingrese nuevamente.");
              safeStorage.removeItem('sys_admin_token');
              safeStorage.removeItem('sesion_time');
              setToken('');
              setSesionTime('');
              setRegistros([]);
              setModalAccesoOpen(true);
            }
          }
        }, 30000);

        return () => clearInterval(intervalo);
      }, [token]);

      // CARGA DEL CATÁLOGO DE ÁREAS DESDE LA HOJA AREAS Y CORRESPONDENCIAS
      useEffect(() => {
        // Cargar catálogo de Áreas desde backend
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              if (res && res.status === 'ok' && Array.isArray(res.areas) && res.areas.length > 0) {
                setAreasCatalogo(res.areas);
              }
            })
            .withFailureHandler(() => { })
            .obtenerAreasCatalogo();
        } else {
          fetch(`${API_URL}?action=obtenerAreas`)
            .then(r => r.json())
            .then(res => {
              if (res && res.status === 'ok' && Array.isArray(res.areas) && res.areas.length > 0) {
                setAreasCatalogo(res.areas);
              }
            })
            .catch(() => { });
        }

        if (token) {
          cargarCorrespondencias(token);
        }
      }, []);

      // Cargar correspondencias desde Backend
      const cargarCorrespondencias = (tokenActivo) => {
        const tok = tokenActivo || token || safeStorage.getItem('sys_admin_token');
        if (!tok) return;

        setCargando(true);
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              setCargando(false);
              if (res && res.status === 'ok' && Array.isArray(res.data)) {
                setRegistros(res.data);
              } else if (res && res.code === 401) {
                setModalAccesoOpen(true);
              }
            })
            .withFailureHandler((err) => {
              setCargando(false);
              console.error("[CORRESPONDENCIA] Error al cargar:", err);
            })
            .obtenerCorrespondencia(tok);
        } else {
          fetch(`${API_URL}?action=obtenerCorrespondencia&token=${encodeURIComponent(tok)}`)
            .then(r => r.json())
            .then(res => {
              setCargando(false);
              if (res && res.status === 'ok' && Array.isArray(res.data)) {
                setRegistros(res.data);
              } else if (res && res.code === 401) {
                setModalAccesoOpen(true);
              }
            })
            .catch(err => {
              setCargando(false);
              console.error("[CORRESPONDENCIA] Fallo fetch:", err);
            });
        }
      };

      // CARGAR DATOS PARA PESTAÑA HERRAMIENTAS (ROLES, PERMISOS Y USUARIOS)
      const cargarHerramientas = () => {
        setCargandoHerr(true);
        const usaGAS = typeof google !== 'undefined' && google.script && google.script.run;

        // CARGA PARALELA: roles + usuarios
        let rolesOk = false, usersOk = false;
        const checkDone = () => { if (rolesOk && usersOk) setCargandoHerr(false); };

        // OBTENER ROLES
        if (usaGAS) {
          google.script.run
            .withSuccessHandler(res => { rolesOk = true; if (res && res.roles) setRolesData(res.roles); checkDone(); })
            .withFailureHandler(() => { rolesOk = true; checkDone(); })
            .obtenerRolesGlobal({token: token});
        } else {
          fetch(`${API_URL}?action=obtenerRoles&token=${encodeURIComponent(token)}`)
            .then(r => r.json())
            .then(res => { rolesOk = true; if (res && res.roles) setRolesData(res.roles); checkDone(); })
            .catch(() => { rolesOk = true; checkDone(); });
        }

        // OBTENER USUARIOS (REUTILIZA obtenerDatosGestion)
        if (usaGAS) {
          google.script.run
            .withSuccessHandler(res => { usersOk = true; if (res && res.usuarios) setUsuariosGestion(res.usuarios); checkDone(); })
            .withFailureHandler(() => { usersOk = true; checkDone(); })
            .obtenerDatosGestion({token: token});
        } else {
          fetch(`${API_URL}?action=obtenerDatosGestion&token=${encodeURIComponent(token)}`)
            .then(r => r.json())
            .then(res => { usersOk = true; if (res && res.usuarios) setUsuariosGestion(res.usuarios); checkDone(); })
            .catch(() => { usersOk = true; checkDone(); });
        }
      };

      // Funcionalidad auxiliar base64 a blob
      const b64toBlob = (b64Data, contentType='', sliceSize=512) => {
        const byteCharacters = atob(b64Data);
        const byteArrays = [];
        for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
          const slice = byteCharacters.slice(offset, offset + sliceSize);
          const byteNumbers = new Array(slice.length);
          for (let i = 0; i < slice.length; i++) {
            byteNumbers[i] = slice.charCodeAt(i);
          }
          const byteArray = new Uint8Array(byteNumbers);
          byteArrays.push(byteArray);
        }
        return new Blob(byteArrays, {type: contentType});
      }

      const handleDescargarRespaldoZip = async () => {
        setCargandoHerr(true);
        try {
          const tok = token || safeStorage.getItem('sys_admin_token');
          let resp = null;
          if (typeof google !== 'undefined' && google.script && google.script.run && google.script.run.generarZipCorrespondenciaGlobal) {
            resp = await new Promise((resolve) => {
              google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(() => resolve({status:'error'}))
                .generarZipCorrespondenciaGlobal({token: tok});
            });
          } else {
            resp = await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'descargarzip', token: tok })
            }).then(r => r.json());
          }
          if (resp && resp.status === 'ok' && resp.base64) {
             const blob = b64toBlob(resp.base64, resp.mimeType);
             const url = window.URL.createObjectURL(blob);
             const a = document.createElement('a');
             a.href = url;
             a.download = resp.fileName || 'Respaldo_Correspondencia.zip';
             document.body.appendChild(a);
             a.click();
             a.remove();
             window.URL.revokeObjectURL(url);
          } else {
             alert("Error al generar respaldo: " + (resp.message || "Desconocido"));
          }
        } catch(e) {
          alert("Error de red: " + e.message);
        }
        setCargandoHerr(false);
      };

      // Limpiar datos visuales de archivo al cambiar opción de adjunto
      useEffect(() => {
        setSubDeDondeVal('');
      }, [deDonde]);

      // Verificación por Clave de Acceso (respetando mayúsculas, minúsculas y caracteres especiales)
      const handleVerificarMatricula = (ev) => {
        if (ev && ev.preventDefault) ev.preventDefault();
        const raw = matriculaInput.trim();
        if (!raw) {
          setMensajeErrorAcceso("Ingrese la clave de acceso.");
          return;
        }

        setValidandoAcceso(true);
        setMensajeErrorAcceso('');

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              setValidandoAcceso(false);
              if (res && res.valid && res.token) {
                const now = Date.now().toString();
                safeStorage.setItem('sys_admin_token', res.token);
                safeStorage.setItem('sesion_time', now);
                setToken(res.token);
                setSesionTime(now);
                setModalAccesoOpen(false);
                setMatriculaInput('');
                cargarCorrespondencias(res.token);
              } else {
                setMensajeErrorAcceso(res && res.message ? res.message : "Clave de acceso no válida o no registrada.");
              }
            })
            .withFailureHandler((err) => {
              setValidandoAcceso(false);
              setMensajeErrorAcceso("Error de conexión: " + (err.message || err));
            })
            .validarAcceso(raw);
        } else {
          fetch(`${API_URL}?action=validarAcceso&claveAcceso=${encodeURIComponent(raw)}`)
            .then(r => r.json())
            .then(res => {
              setValidandoAcceso(false);
              if (res && res.valid && res.token) {
                const now = Date.now().toString();
                safeStorage.setItem('sys_admin_token', res.token);
                safeStorage.setItem('sesion_time', now);
                setToken(res.token);
                setSesionTime(now);
                setModalAccesoOpen(false);
                setMatriculaInput('');
                cargarCorrespondencias(res.token);
              } else {
                setMensajeErrorAcceso(res && res.message ? res.message : "Clave de acceso no válida o no registrada.");
              }
            })
            .catch(err => {
              setValidandoAcceso(false);
              setMensajeErrorAcceso("Error de conexión: " + err.message);
            });
        }
      };

      // Conversión de archivo PDF
      const handleFileChange = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        if (file.type !== "application/pdf") {
          alert("Por favor cargue un documento en formato PDF.");
          fileInputRef.current.value = "";
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          setArchivoPdf(e.target.result);
          setArchivoPdfNombre(file.name);
        };
        reader.readAsDataURL(file);
      };

      // Previsualización flotante
      const handleMouseEnterPdf = (e, url) => {
        if (!url) return;
        const rect = e.target.getBoundingClientRect();
        setHoveredPdfPos({
          top: rect.bottom + window.scrollY + 6,
          left: Math.max(10, rect.left + window.scrollX - 120)
        });
        setHoveredPdfUrl(url);
      };

      const handleMouseLeavePdf = () => {
        setHoveredPdfUrl(null);
      };

      // Selección múltiple de áreas
      const toggleAreaDirigida = (areaNombre) => {
        if (dirigidoAreas.includes(areaNombre)) {
          setDirigidoAreas(dirigidoAreas.filter(item => item !== areaNombre));
        } else {
          setDirigidoAreas([...dirigidoAreas, areaNombre]);
        }
      };

      // Envío de Formulario al Backend (Google Sheets)
      const handleSubmit = (event) => {
        event.preventDefault();

        if (!token) {
          setLoginModalOpen(true);
          return;
        }

        if (!noDocto.trim()) return alert("Favor de capturar el 'No. Docto'.");
        if (deDonde === 'area_interna' && !subDeDondeVal) return alert("Favor de seleccionar el área interna emisora.");
        if (deDonde === 'derechohabiente' && (!subDeDondeVal || subDeDondeVal.length < 11)) return alert("Favor de capturar un NSS válido (11 dígitos).");
        if (deDonde === 'dependencia' && !subDeDondeVal.trim()) return alert("Favor de escribir el nombre de la dependencia.");
        if (!fechaRecepcion) return alert("Favor de capturar la fecha de recepción.");
        if (!sinFecha && !fechaTermino) return alert("Favor de capturar la fecha de término o marcar la opción 'Sin fecha'.");
        if (dirigidoAreas.length === 0) return alert("Debe seleccionar al menos un área a donde se dirige el documento.");

        const remitenteFormateado = deDonde === 'area_interna'
          ? `${subDeDondeVal} (ÁREA INTERNA)`
          : deDonde === 'dependencia'
            ? `${subDeDondeVal.toUpperCase()} (DEPENDENCIA)`
            : `NSS: ${subDeDondeVal} (DERECHOHABIENTE)`;

        const asuntoFinal = asunto.trim() ? asunto.trim().toUpperCase() : `DOCUMENTO ENTRANTE ${noDocto.toUpperCase()}`;

        const nuevoRegistro = {
          FECHA_RECEPCION: fechaRecepcion,
          OFICIO_ORIGEN: noDocto.toUpperCase(),
          REMITENTE: remitenteFormateado,
          ASUNTO: asuntoFinal,
          FECHA_TERMINO: sinFecha ? "" : fechaTermino,
          DIRIGIDO_A: dirigidoAreas.join(', '),
          ACUSE_RECIBIDO: archivoPdf || ""
        };

        setGuardando(true);

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              setGuardando(false);
              if (res && res.status === 'ok') {
                alert("Correspondencia registrada con éxito.");
                resetFormulario();
                cargarCorrespondencias(token);

        if (eEvent && eEvent.preventDefault) eEvent.preventDefault();
        if (!correoForm.destinatario.trim()) return alert("Ingrese al menos un destinatario.");
        setGenerandoCorreo(true);
        
        try {
            let base64File = "";
            let fileName = correoReg.OFICIO_ORIGEN ? `acuse_${correoReg.OFICIO_ORIGEN}.pdf` : "archivo.pdf";
            let mimeType = "application/pdf";
            
            if (correoReg.ACUSE_RECIBIDO) {
                if (correoReg.ACUSE_RECIBIDO.startsWith("data:")) {
                    base64File = correoReg.ACUSE_RECIBIDO.split(",")[1];
                } else {
                    const tok = token || safeStorage.getItem('sys_admin_token');
                    let payload = { action: 'proxyanexo', url: correoReg.ACUSE_RECIBIDO, token: tok };
                    let resp = null;
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        resp = await new Promise((resolve) => {
                            google.script.run
                                .withSuccessHandler(resolve)
                                .withFailureHandler(() => resolve({status:'error'}))
                                .obtenerAnexoProxy(payload);
                        });
                    } else {
                        resp = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload)
                        }).then(r => r.json());
                    }
                    if (resp && resp.status === 'ok') {
                        base64File = resp.base64;
                        if(resp.fileName) fileName = resp.fileName;
                        if(resp.mimeType) mimeType = resp.mimeType;
                    }
                }
            }
            
            const boundary = "----=_NextPart_" + Date.now().toString(16);
            let emlContent = `To: ${correoForm.destinatario.trim()}\r\n`;
            emlContent += `Subject: =?UTF-8?Q?${encodeURIComponent(correoForm.asunto).replace(/%/g, '=')}?=\r\n`;
            emlContent += `MIME-Version: 1.0\r\n`;
            emlContent += `Content-Type: multipart/mixed; boundary="${boundary}"\r\n\r\n`;
            
            emlContent += `--${boundary}\r\n`;
            emlContent += `Content-Type: text/plain; charset="UTF-8"\r\n\r\n`;
            emlContent += `Se envía el siguiente correo que corresponde al archivo ${fileName} . Atentamente.\r\n\r\n`;
            
            if (base64File) {
                emlContent += `--${boundary}\r\n`;
                emlContent += `Content-Type: ${mimeType}; name="${fileName}"\r\n`;
                emlContent += `Content-Disposition: attachment; filename="${fileName}"\r\n`;
                emlContent += `Content-Transfer-Encoding: base64\r\n\r\n`;
                
                const formattedBase64 = base64File.match(/.{1,76}/g).join('\r\n');
                emlContent += formattedBase64 + `\r\n\r\n`;
            }
            
            emlContent += `--${boundary}--\r\n`;
            
            const blob = new Blob([emlContent], { type: 'message/rfc822' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Correo_${correoForm.asunto}_${correoReg.OFICIO_ORIGEN || "Documento"}.eml`;

                                e('td', { className: 'px-2 py-1.5 whitespace-nowrap' },
                                  e('div', { className: 'flex flex-col gap-0.5' },
                                    e('span', {
                                      className: `inline-flex items-center text-[8px] font-extrabold px-2 py-0.5 rounded-full w-max ${reg.ESTATUS === 'ATENDIDO'
                                        ? 'bg-emerald-100 text-emerald-800 border border-emerald-200'
                                        : 'bg-amber-100 text-amber-800 border border-amber-200'
                                        }`
                                    }, reg.ESTATUS || 'PENDIENTE'),
                                    reg.FOLIO_RESPUESTA
                                      ? e('span', { className: 'text-[9px] font-mono font-bold text-gray-600' }, reg.FOLIO_RESPUESTA)
                                      : null
                                  )
                                ),
                                // Acción: Botón Correo
                                e('td', { className: 'px-2 py-1.5 whitespace-nowrap' },
                                  reg.ESTATUS === 'PENDIENTE'
                                    ? e('button', {
                                      onClick: () => handleAbrirCorreo(reg),
                                      title: 'Generar correo electrónico para este documento',
                                      className: 'inline-flex items-center px-2 py-1 text-[9px] font-bold text-white inst-green hover:bg-[#66C895] rounded-lg transition-all shadow shadow-[#8DE0B6]/30 active:scale-95'
                                    }, 'Correo', e(IconMail))
                                    : e('span', { className: 'text-[9px] font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200' }, '✓ Atendido')
                                )
                              )
                            )
                        )
                      )
                    )
                  )
          ),

          // Hover Preview Flotante
          hoveredPdfUrl && e('div', {
            style: {
              position: 'absolute',
              top: hoveredPdfPos.top,
              left: hoveredPdfPos.left,
              zIndex: 100
            },
            className: 'w-72 h-44 glass-card border border-emerald-600/30 rounded-xl shadow-2xl overflow-hidden pointer-events-none animate-modal'
          },
            e('iframe', {
              src: hoveredPdfUrl,
              className: 'w-full h-full border-none',
              scrolling: 'no'
            })
          ),

          // Modal Visor Embebido (Pantalla completa interna al hacer clic)
          previewModalUrl && e('div', { className: 'fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4' },
            e('div', { className: 'bg-white rounded-2xl shadow-2xl max-w-5xl w-full h-[85vh] flex flex-col overflow-hidden animate-modal border border-white' },
              e('div', { className: 'px-5 py-3 border-b border-gray-100 flex items-center justify-between bg-gray-50' },
                e('h3', { className: 'text-xs font-bold inst-text' }, 'Visualizador de Correspondencia Adjunta'),
                e('button', {
                  className: 'text-gray-400 hover:text-gray-600 p-1 bg-white hover:bg-gray-100 rounded-lg transition-all border border-gray-200',
                  onClick: () => setPreviewModalUrl(null)
                }, e(IconX))
              ),
              e('div', { className: 'flex-1 bg-gray-100' },
                e('iframe', {
                  src: previewModalUrl,
                  className: 'w-full h-full border-none'
                })
              )
            )
          ),

          // MODAL CORREO EML
          modalCorreoOpen && e('div', { className: 'fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4' },
            e('div', { className: 'bg-white p-6 md:p-8 rounded-3xl w-full max-w-md flex flex-col relative animate-modal shadow-2xl' },
              e('button', {
                className: 'absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 text-gray-600 p-1.5 rounded-full transition-all',
                onClick: () => setModalCorreoOpen(false)
              }, e(IconX)),
              e('h3', { className: 'text-lg font-bold inst-text mb-1' }, 'Generar Correo (.eml)'),
              e('p', { className: 'text-xs text-gray-500 mb-6' }, `Documento: ${correoReg?.OFICIO_ORIGEN}`),
              
              e('form', { onSubmit: handleGenerarEml, className: 'space-y-4' },
                e('div', null,
                  e('label', { className: 'block text-[11px] font-bold text-gray-600 uppercase mb-1.5' }, 'Asunto *'),
                  e('select', {
                    required: true,
                    className: 'w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-xs inst-border-focus bg-gray-50/50 font-semibold',
                    value: correoForm.asunto,
                    onChange: (e) => setCorreoForm({...correoForm, asunto: e.target.value})
                  },
                    e('option', { value: 'CONOCIMIENTO' }, 'CONOCIMIENTO'),
                    e('option', { value: 'ANALISIS' }, 'ANALISIS'),
                    e('option', { value: 'DIFUSION' }, 'DIFUSION'),
                    e('option', { value: 'TRAMITE' }, 'TRAMITE')
                  )
                ),
                e('div', null,
                  e('label', { className: 'block text-[11px] font-bold text-gray-600 uppercase mb-1.5' }, 'Destinatario (s) *'),
                  e('input', {
                    required: true,
                    type: 'text',
                    placeholder: 'prueba1@correo.com, prueba2@correo.com',
                    className: 'w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-xs inst-border-focus bg-gray-50/50 font-medium',
                    value: correoForm.destinatario,
                    onChange: (e) => setCorreoForm({...correoForm, destinatario: e.target.value})
                  })
                ),
                e('div', { className: 'pt-2' },
                  e('button', {
                    type: 'submit',
                    disabled: generandoCorreo,
                    className: `w-full py-3 rounded-xl text-xs font-bold text-white inst-green inst-green-hover transition-all shadow-lg shadow-[#8DE0B6]/30 active:scale-95 flex items-center justify-center ${generandoCorreo ? 'opacity-50 cursor-wait' : ''}`
                  }, 
                  generandoCorreo ? 'Generando archivo .eml ...' : 'Generar Archivo de Correo')
                )
              )
            )
          ),
          // Pie de Página
          e('footer', { className: 'py-3 text-center text-[10px] text-gray-400 font-semibold mt-auto border-t border-gray-200/50 w-full' },
            '© 2026 • Control de Correspondencia Institucional • Sesión con expiración estricta de 30 minutos'
          )
        )
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(e(App));
  </script>
</body>

</html>
