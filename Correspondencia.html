<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Correspondencia</title>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <!-- Tailwind CSS v2.2.19 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F0F7F4;
      background-image: radial-gradient(at 0% 0%, rgba(63, 133, 105, 0.05) 0px, transparent 50%),
        radial-gradient(at 50% 0%, rgba(0, 61, 37, 0.03) 0px, transparent 50%);
    }

    /* Estilos Glassmorphism */
    .glass-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(229, 231, 235, 0.8);
    }

    /* Color Institucional */
    .imss-green {
      background-color: #3f8569;
    }

    .imss-green-hover:hover {
      background-color: #004d33;
    }

    .imss-text {
      color: #003d25;
    }

    .imss-border-focus:focus {
      border-color: #3f8569;
      outline: none;
      box-shadow: 0 0 0 3px rgba(63, 133, 105, 0.2);
    }

    /* Scrollbar personalizada */
    .table-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .table-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .table-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .table-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Entrada de texto forzada a Mayúsculas */
    .input-upper {
      text-transform: uppercase;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.95);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-modal {
      animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body class="min-h-screen text-gray-800 antialiased w-full">
  <div id="root" class="w-full min-h-screen"></div>

  <!-- React 18 Core Production -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <!-- ReactDOM 18 Production -->
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useRef } = React;

    // CONFIGURACIÓN DINÁMICA DE API (VÍA QUERY PARAM ?api=..., LOCALSTORAGE O ENDPOINT DEFAULT)
    const urlParams = new URLSearchParams(window.location.search);
    const API_URL = urlParams.get('api') || localStorage.getItem('imss_api_url') || "https://script.google.com/macros/s/AKfycby2R4cndCbS5HdXbopVMrEiOPR3B67P_T53pvzSHVISRw42bF1ZDDbBRIXwFZnJMvMw/exec";
    if (urlParams.get('api')) {
      localStorage.setItem('imss_api_url', urlParams.get('api'));
    }

    // Iconos SVG Integrados en código
    const IconPlusCircle = () => e('svg', { className: 'w-4 h-4 mr-1.5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z' }));
    const IconTable = () => e('svg', { className: 'w-4 h-4 mr-1.5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' }));
    const IconUpload = () => e('svg', { className: 'w-7 h-7 mb-2 text-gray-400', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12' }));
    const IconTrash = () => e('svg', { className: 'w-4 h-4 text-red-500', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16' }));
    const IconEye = () => e('svg', { className: 'w-3.5 h-3.5 mr-1', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M15 12a3 3 0 11-6 0 3 3 0 016 0z' }), e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z' }));
    const IconX = () => e('svg', { className: 'w-4 h-4', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M6 18L18 6M6 6l12 12' }));
    const IconCheck = () => e('svg', { className: 'w-4 h-4 mr-1.5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2.5' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M5 13l4 4L19 7' }));
    const IconExternalLink = () => e('svg', { className: 'w-3.5 h-3.5 ml-1', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14' }));
    const IconLock = () => e('svg', { className: 'w-8 h-8 text-[#3f8569]', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' }));
    const IconRefresh = () => e('svg', { className: 'w-3.5 h-3.5 mr-1', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24', strokeWidth: '2' }, e('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15' }));

    function App() {
      // Estado de Autenticación y Sesión
      const [token, setToken] = useState(() => sessionStorage.getItem('imss_admin_token') || '');
      const [loginTime, setLoginTime] = useState(() => sessionStorage.getItem('login_time') || '');
      const [loginModalOpen, setLoginModalOpen] = useState(!sessionStorage.getItem('imss_admin_token'));
      const [pwdInput, setPwdInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [validandoLogin, setValidandoLogin] = useState(false);

      // Pestañas
      const [pestaña, setPestaña] = useState('captura');

      // Estado Formulario de Captura
      const [noDocto, setNoDocto] = useState('');
      const [asunto, setAsunto] = useState('');
      const [deDonde, setDeDonde] = useState('area_interna');
      const [subDeDondeVal, setSubDeDondeVal] = useState('');
      const [fechaRecepcion, setFechaRecepcion] = useState('');
      const [fechaTermino, setFechaTermino] = useState('');
      const [sinFecha, setSinFecha] = useState(false);
      const [dirigidoAreas, setDirigidoAreas] = useState([]);
      const [archivoPdf, setArchivoPdf] = useState(null);
      const [archivoPdfNombre, setArchivoPdfNombre] = useState('');
      const [guardando, setGuardando] = useState(false);

      // Catálogos e Histórico
      const [areasCatalogo, setAreasCatalogo] = useState([]);
      const [registros, setRegistros] = useState([]);
      const [cargando, setCargando] = useState(false);
      const [filtroBusqueda, setFiltroBusqueda] = useState('');
      const [filtroEstatus, setFiltroEstatus] = useState('TODOS');
      const [showDropdownAreas, setShowDropdownAreas] = useState(false);

      // Referencias para Hover y Visor de Archivos
      const [hoveredPdfUrl, setHoveredPdfUrl] = useState(null);
      const [hoveredPdfPos, setHoveredPdfPos] = useState({ top: 0, left: 0 });
      const [previewModalUrl, setPreviewModalUrl] = useState(null);
      const fileInputRef = useRef(null);

      // REVISIÓN PERIÓDICA DE EXPIRACIÓN DEL TOKEN (CADA 30 SEGUNDOS - MÁXIMO 1,800,000 MS / 30 MIN)
      useEffect(() => {
        if (!token) return;
        const intervalo = setInterval(() => {
          const lt = sessionStorage.getItem('login_time');
          if (lt) {
            const diff = Date.now() - parseInt(lt, 10);
            if (diff >= 1800000) { // 30 minutos cumplidos
              alert("Su sesión ha expirado por límite de tiempo de 30 minutos. Ingrese nuevamente.");
              sessionStorage.removeItem('imss_admin_token');
              sessionStorage.removeItem('login_time');
              setToken('');
              setLoginTime('');
              setRegistros([]);
              setLoginModalOpen(true);
            }
          }
        }, 30000);

        return () => clearInterval(intervalo);
      }, [token]);

      // CARGA DEL CATÁLOGO DE ÁREAS DESDE LA HOJA AREAS Y CORRESPONDENCIAS
      useEffect(() => {
        // Cargar catálogo de Áreas desde backend
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              if (res && res.status === 'ok' && Array.isArray(res.areas) && res.areas.length > 0) {
                setAreasCatalogo(res.areas);
              }
            })
            .withFailureHandler(() => { })
            .obtenerAreasCatalogo();
        } else {
          fetch(`${API_URL}?action=obtenerAreas`)
            .then(r => r.json())
            .then(res => {
              if (res && res.status === 'ok' && Array.isArray(res.areas) && res.areas.length > 0) {
                setAreasCatalogo(res.areas);
              }
            })
            .catch(() => { });
        }

        if (token) {
          cargarCorrespondencias(token);
        }
      }, []);

      // Cargar correspondencias desde Backend
      const cargarCorrespondencias = (tokenActivo) => {
        const tok = tokenActivo || token || sessionStorage.getItem('imss_admin_token');
        if (!tok) return;

        setCargando(true);
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              setCargando(false);
              if (res && res.status === 'ok' && Array.isArray(res.data)) {
                setRegistros(res.data);
              } else if (res && res.code === 401) {
                setLoginModalOpen(true);
              }
            })
            .withFailureHandler((err) => {
              setCargando(false);
              console.error("[CORRESPONDENCIA] Error al cargar:", err);
            })
            .obtenerCorrespondencia(tok);
        } else {
          fetch(`${API_URL}?action=obtenerCorrespondencia&token=${encodeURIComponent(tok)}`)
            .then(r => r.json())
            .then(res => {
              setCargando(false);
              if (res && res.status === 'ok' && Array.isArray(res.data)) {
                setRegistros(res.data);
              } else if (res && res.code === 401) {
                setLoginModalOpen(true);
              }
            })
            .catch(err => {
              setCargando(false);
              console.error("[CORRESPONDENCIA] Fallo fetch:", err);
            });
        }
      };

      // Limpiar subcampo al cambiar tipo de origen
      useEffect(() => {
        setSubDeDondeVal('');
      }, [deDonde]);

      // Autenticación de Admin vía google.script.run / API
      const handleLogin = (ev) => {
        if (ev && ev.preventDefault) ev.preventDefault();
        const pwdRaw = pwdInput.trim();
        if (!pwdRaw) {
          setLoginError("Ingrese la matrícula.");
          return;
        }

        const matricula = pwdRaw.toUpperCase().endsWith('M') ? pwdRaw.toUpperCase() : pwdRaw.toUpperCase() + 'M';
        setValidandoLogin(true);
        setLoginError('');

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              setValidandoLogin(false);
              if (res && res.valid && res.token) {
                const now = Date.now().toString();
                sessionStorage.setItem('imss_admin_token', res.token);
                sessionStorage.setItem('login_time', now);
                setToken(res.token);
                setLoginTime(now);
                setLoginModalOpen(false);
                setPwdInput('');
                cargarCorrespondencias(res.token);
              } else {
                setLoginError(res && res.message ? res.message : "Acceso denegado. Se requiere rol ADMIN.");
              }
            })
            .withFailureHandler((err) => {
              setValidandoLogin(false);
              setLoginError("Error de conexión: " + (err.message || err));
            })
            .validarAcceso(matricula);
        } else {
          fetch(`${API_URL}?action=validarAcceso&password=${encodeURIComponent(matricula)}`)
            .then(r => r.json())
            .then(res => {
              setValidandoLogin(false);
              if (res && res.valid && res.token) {
                const now = Date.now().toString();
                sessionStorage.setItem('imss_admin_token', res.token);
                sessionStorage.setItem('login_time', now);
                setToken(res.token);
                setLoginTime(now);
                setLoginModalOpen(false);
                setPwdInput('');
                cargarCorrespondencias(res.token);
              } else {
                setLoginError(res && res.message ? res.message : "Acceso denegado. Se requiere rol ADMIN.");
              }
            })
            .catch(err => {
              setValidandoLogin(false);
              setLoginError("Error de conexión: " + err.message);
            });
        }
      };

      // Conversión de archivo PDF
      const handleFileChange = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        if (file.type !== "application/pdf") {
          alert("Por favor cargue un documento en formato PDF.");
          fileInputRef.current.value = "";
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          setArchivoPdf(e.target.result);
          setArchivoPdfNombre(file.name);
        };
        reader.readAsDataURL(file);
      };

      // Previsualización flotante
      const handleMouseEnterPdf = (e, url) => {
        if (!url) return;
        const rect = e.target.getBoundingClientRect();
        setHoveredPdfPos({
          top: rect.bottom + window.scrollY + 6,
          left: Math.max(10, rect.left + window.scrollX - 120)
        });
        setHoveredPdfUrl(url);
      };

      const handleMouseLeavePdf = () => {
        setHoveredPdfUrl(null);
      };

      // Selección múltiple de áreas
      const toggleAreaDirigida = (areaNombre) => {
        if (dirigidoAreas.includes(areaNombre)) {
          setDirigidoAreas(dirigidoAreas.filter(item => item !== areaNombre));
        } else {
          setDirigidoAreas([...dirigidoAreas, areaNombre]);
        }
      };

      // Envío de Formulario al Backend (Google Sheets)
      const handleSubmit = (event) => {
        event.preventDefault();

        if (!token) {
          setLoginModalOpen(true);
          return;
        }

        if (!noDocto.trim()) return alert("Favor de capturar el 'No. Docto'.");
        if (deDonde === 'area_interna' && !subDeDondeVal) return alert("Favor de seleccionar el área interna emisora.");
        if (deDonde === 'derechohabiente' && (!subDeDondeVal || subDeDondeVal.length < 11)) return alert("Favor de capturar un NSS válido (11 dígitos).");
        if (deDonde === 'dependencia' && !subDeDondeVal.trim()) return alert("Favor de escribir el nombre de la dependencia.");
        if (!fechaRecepcion) return alert("Favor de capturar la fecha de recepción.");
        if (!sinFecha && !fechaTermino) return alert("Favor de capturar la fecha de término o marcar la opción 'Sin fecha'.");
        if (dirigidoAreas.length === 0) return alert("Debe seleccionar al menos un área a donde se dirige el documento.");

        const remitenteFormateado = deDonde === 'area_interna'
          ? `${subDeDondeVal} (ÁREA INTERNA)`
          : deDonde === 'dependencia'
            ? `${subDeDondeVal.toUpperCase()} (DEPENDENCIA)`
            : `NSS: ${subDeDondeVal} (DERECHOHABIENTE)`;

        const asuntoFinal = asunto.trim() ? asunto.trim().toUpperCase() : `DOCUMENTO ENTRANTE ${noDocto.toUpperCase()}`;

        const nuevoRegistro = {
          FECHA_RECEPCION: fechaRecepcion,
          OFICIO_ORIGEN: noDocto.toUpperCase(),
          REMITENTE: remitenteFormateado,
          ASUNTO: asuntoFinal,
          FECHA_TERMINO: sinFecha ? "" : fechaTermino,
          DIRIGIDO_A: dirigidoAreas.join(', '),
          ACUSE_RECIBIDO: archivoPdf || ""
        };

        setGuardando(true);

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              setGuardando(false);
              if (res && res.status === 'ok') {
                alert("Correspondencia registrada con éxito.");
                resetFormulario();
                cargarCorrespondencias(token);
                setPestaña('registrada');
              } else {
                alert("Error al registrar: " + (res.message || ""));
              }
            })
            .withFailureHandler((err) => {
              setGuardando(false);
              alert("Error al conectar con el servidor: " + err.message);
            })
            .registrarCorrespondencia(nuevoRegistro, token);
        } else {
          fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: "registrarCorrespondencia",
              token: token,
              ...nuevoRegistro
            })
          })
            .then(r => r.json())
            .then(res => {
              setGuardando(false);
              if (res && res.status === 'ok') {
                alert("Correspondencia registrada con éxito.");
                resetFormulario();
                cargarCorrespondencias(token);
                setPestaña('registrada');
              } else {
                alert("Error: " + (res.message || ""));
              }
            })
            .catch(err => {
              setGuardando(false);
              alert("Error de conexión: " + err.message);
            });
        }
      };

      const resetFormulario = () => {
        setNoDocto('');
        setAsunto('');
        setDeDonde('area_interna');
        setSubDeDondeVal('');
        setFechaRecepcion('');
        setFechaTermino('');
        setSinFecha(false);
        setDirigidoAreas([]);
        setArchivoPdf(null);
        setArchivoPdfNombre('');
        if (fileInputRef.current) fileInputRef.current.value = "";
      };

      // VINCULACIÓN DINÁMICA: ABRIR CONTROL DE FOLIOS EN GITHUB CON PARÁMETROS
      const handleAtenderConFolio = (reg) => {
        const refId = reg.ID_CORRESPONDENCIA || "";
        const oficio = reg.OFICIO_ORIGEN || "";
        const remitente = reg.REMITENTE || "";
        const asuntoLimpio = reg.ASUNTO || "ATENCIÓN A CORRESPONDENCIA";
        const asuntoFormateado = `ATENCIÓN A OFICIO ${oficio}: ${asuntoLimpio}`;

        const url = new URL('Bitacora_folio.html', window.location.href);
        url.searchParams.set('action', 'nuevo_folio');
        url.searchParams.set('asunto', asuntoFormateado);
        url.searchParams.set('dirigido', remitente);
        url.searchParams.set('refId', refId);
        url.searchParams.set('api', API_URL);

        window.open(url.toString(), '_blank');
      };

      // Filtrado en tabla
      const registrosFiltrados = registros.filter(r => {
        const matchEstatus = filtroEstatus === 'TODOS' || (String(r.ESTATUS || '').toUpperCase() === filtroEstatus);
        if (!matchEstatus) return false;
        if (!filtroBusqueda.trim()) return true;
        const q = filtroBusqueda.toLowerCase();
        return Object.values(r).some(v => String(v).toLowerCase().includes(q));
      });

      // Si no hay sesión activa, renderizar SOLO la pantalla de login (sin formulario de fondo)
      if (loginModalOpen) {
        return e('div', { className: 'min-h-screen w-full flex items-center justify-center', style: { background: 'radial-gradient(ellipse at 60% 20%, rgba(63,133,105,0.10) 0%, transparent 60%), radial-gradient(ellipse at 10% 80%, rgba(0,61,37,0.07) 0%, transparent 60%), #F0F7F4' } },
          // Tarjeta de login centrada en pantalla limpia
          e('div', { className: 'bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 sm:p-10 animate-modal border border-[#3f8569]/15 text-center mx-4' },
            // Logo Institucional
            e('div', { className: 'flex justify-center mb-5' },
              e('div', { className: 'imss-green text-white px-4 py-2 rounded-xl font-black text-xl shadow-lg tracking-widest' }, 'SGD')
            ),
            e('div', { className: 'mx-auto w-14 h-14 bg-[#F0F7F4] rounded-2xl flex items-center justify-center mb-4 border border-[#3f8569]/30 shadow-inner' },
              e(IconLock)
            ),
            e('h2', { className: 'text-xl font-black text-[#003d25] mb-1 tracking-tight' }, 'Acceso Administrativo'),
            e('p', { className: 'text-xs text-gray-500 mb-2' }, 'Control de Correspondencia Institucional'),
            e('p', { className: 'text-[11px] text-gray-400 mb-6 border-t border-gray-100 pt-4' }, 'Ingrese su matrícula autorizada con rol ADMIN para acceder al sistema.'),
            loginError ? e('div', { className: 'mb-4 p-2.5 bg-red-50 border border-red-200 text-red-700 rounded-xl text-xs font-medium' }, loginError) : null,
            e('form', { onSubmit: handleLogin, className: 'space-y-4' },
              e('input', {
                type: 'password',
                autoFocus: true,
                required: true,
                placeholder: 'MATRÍCULA (EJ. 12345678M)',
                className: 'w-full px-4 py-3 rounded-xl border border-gray-300 text-sm font-mono tracking-widest input-upper imss-border-focus text-center bg-gray-50 font-bold',
                value: pwdInput,
                onChange: (ev) => setPwdInput(ev.target.value)
              }),
              e('button', {
                type: 'submit',
                disabled: validandoLogin,
                className: `w-full py-3 rounded-xl text-xs font-bold text-white imss-green imss-green-hover transition-all shadow-lg shadow-[#3f8569]/30 active:scale-95 ${validandoLogin ? 'opacity-50 cursor-wait' : ''}`
              }, validandoLogin ? 'Verificando credenciales...' : 'Ingresar al Sistema')
            ),
            e('p', { className: 'text-[9px] text-gray-300 mt-6 font-medium' }, '© 2026 • Sesión con expiración de 30 minutos')
          )
        );
      }

      return (
